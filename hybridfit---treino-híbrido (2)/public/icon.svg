<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#0B1016"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#19222D" stroke="#BEF264" stroke-width="8" stroke-opacity="0.3"/>
  
  <!-- Dumbbell / Hybrid Bolt Icon -->
  <g transform="translate(106, 106)">
    <!-- Dumbbell Left Plate -->
    <rect x="20" y="70" width="30" height="160" rx="15" fill="#BEF264"/>
    <rect x="55" y="90" width="20" height="120" rx="10" fill="#93C5FD"/>
    
    <!-- Dumbbell Right Plate -->
    <rect x="250" y="70" width="30" height="160" rx="15" fill="#BEF264"/>
    <rect x="225" y="90" width="20" height="120" rx="10" fill="#93C5FD"/>
    
    <!-- Dumbbell Bar -->
    <rect x="75" y="138" width="150" height="24" rx="8" fill="#E2E8F0"/>
    
    <!-- Center Cardio Pulse / Lightning bolt in Lime -->
    <path d="M120 150 L145 150 L160 80 L185 220 L200 130 L215 150 L240 150" fill="none" stroke="#BEF264" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Letter H subtle accent -->
    <circle cx="150" cy="250" r="6" fill="#BEF264"/>
    <circle cx="175" cy="250" r="6" fill="#BEF264"/>
  </g>
</svg>
